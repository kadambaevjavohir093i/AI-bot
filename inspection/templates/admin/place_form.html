<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ 'Edit' if place else 'New' }} Place</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/admin" class="nav-brand">← Admin</a>
  </nav>
  <main class="container" style="max-width:600px">
    <h1>{{ 'Edit' if place else 'Add New' }} Place</h1>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST"
          action="{{ '/admin/places/' + place.id|string + '/edit' if place else '/admin/places/new' }}"
          class="form-card">
      <label>Place Name <span class="required">*</span>
        <input type="text" name="name" required
               value="{{ place.name if place else '' }}"
               placeholder="e.g. Warehouse A, Truck #123">
      </label>
      <label>Description
        <textarea name="description" rows="3"
                  placeholder="Optional description">{{ place.description if place else '' }}</textarea>
      </label>
      <div class="form-actions">
        <a href="/admin" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">
          {{ 'Save Changes' if place else 'Create Place' }}
        </button>
      </div>
    </form>
  </main>
</body>
</html>
